name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.pypi.outputs.already_published }}
      release_exists: ${{ steps.github.outputs.release_exists }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Read package version
        id: version
        run: echo "version=$(python build.py --print-version)" >> "${GITHUB_OUTPUT}"

      - name: Select release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check whether version is already on PyPI
        id: pypi
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl --fail --silent --show-error \
            "https://pypi.org/pypi/pixoo-spotify/${PACKAGE_VERSION}/json" >/dev/null; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check whether GitHub Release already exists
        id: github
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and verify release artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: python build.py --build --tag "v${PACKAGE_VERSION}"

      - name: Generate release notes
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release-notes.py "v${PACKAGE_VERSION}" > release-notes.md

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v5
        with:
          name: python-package-release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'workflow_run' && needs.build.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixoo-spotify/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      needs.build.result == 'success' &&
      needs.build.outputs.release_exists == 'false' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Download release notes
        uses: actions/download-artifact@v5
        with:
          name: python-package-release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          tag="v${PACKAGE_VERSION}"
          gh release create "${tag}" \
            --target "${RELEASE_SHA}" \
            --title "${tag}" \
            --notes-file release-notes.md
